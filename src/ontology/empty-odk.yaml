id: empty
title: "Experimental Measurements Purposes and Treatments ontologY"
github_org: Waltham-Data-Science
git_main_branch: main
repo: empty-ontology
release_artefacts:
  - base
  - full
  - simple
primary_release: full
export_formats:
  - owl
  - obo
  - json
import_group:
  products:
    - id: uberon
    - id: ncit
    - id: ncbitaxon
    - id: ro
    - id: pato
    - id: omo
    - id: obi
    - id: iao
    - id: cob
    - id: stato
    - id: mco
    - id: chebi
      is_large: true
      mirror_from: http://purl.obolibrary.org/obo/chebi/chebi_lite.owl
    - id: sio
      mirror_from: http://semanticscience.org/ontology/sio.owl
      base_iris:
        - http://semanticscience.org/resource/SIO_
id_ranges:
  - name: "Main Editor"
    start: 1
    end: 999999
robot_java_args: "-Xmx8G"
robot_report:
  use_labels: TRUE
  fail_on: ERROR
  custom_profile: TRUE
  report_on:
    - edit
