site_name: "EMPTY"
site_description: "Experimental Measurements Purposes and Treatments ontologY"
site_author: "Waltham Data Science"
repo_url: https://github.com/Waltham-Data-Science/empty-ontology
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate

nav:
  - Home: index.md
  - Guide:
      - How to Edit: editors-guide.md
      - Installing Tools: installation.md
  - Workflows:
      - ODK Overview: odk-workflows/index.md
      - Running Builds: odk-workflows/DockerWorkflow.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
